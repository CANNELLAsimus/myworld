<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя Деревня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#0a2216;--field:#0f3321;--ui:#0f172a;--ui2:#1e293b;--line:#334155;--blue:#3b82f6;--blue2:#60a5fa;--txt:#e2e8f0;--mut:#94a3b8;--bad:#f87171;--ok:#4ade80;--yel:#facc15;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-weight:600;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
.top{background:var(--ui);border-bottom:2px solid var(--line);padding:6px 8px}
.resrow{display:flex;gap:6px}
.res{flex:1;background:var(--ui2);border:1px solid var(--line);border-radius:10px;padding:3px 8px;display:flex;justify-content:space-between;align-items:center}
.res b{font-size:18px;font-weight:800;color:var(--yel)}
.stats{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:8px;flex-wrap:wrap}
.g{color:var(--ok)}.r{color:var(--bad)}
#reset{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;text-decoration:underline;cursor:pointer}
main{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
#village{overflow:auto;scrollbar-width:thin;background:#0a2216}
#world{position:relative;width:200%;height:200%;isolation:isolate;touch-action:pan-x pan-y;background:var(--field) repeating-linear-gradient(45deg,#ffffff07 0 12px,transparent 12px 24px)}
.ent{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;text-align:center;line-height:1}
.ent .em{font-size:38px;display:block;filter:drop-shadow(0 2px 2px #0008)}
.ent.sm .em{font-size:24px}.ent.p .em{font-size:30px}
.ent.drag{cursor:grabbing;transform:translate(-50%,-50%) scale(1.2)}
.bub{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:var(--ui);border:1px solid var(--blue2);border-radius:10px;font-size:13px;padding:1px 5px;white-space:nowrap;display:none}
.bub.on{display:block}
.nm{font-size:10px;color:#cbd5e1;font-style:normal;display:block;margin-top:2px}
.scr2.on{display:flex;flex-direction:column;align-items:center;gap:10px;overflow:auto;padding:16px}
#mine{background:linear-gradient(#0b1220,#16233b)}#forest{background:linear-gradient(#08210f,#0f3a1e)}
.big{width:200px;height:200px;flex:none;border-radius:50%;border:6px solid var(--blue);font-size:92px;line-height:1;cursor:pointer;box-shadow:0 8px 0 #1d4ed8,0 0 30px #3b82f655;transition:transform .06s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #1d4ed8}
.big.m{background:radial-gradient(circle at 35% 30%,#475569,#1e293b)}.big.t{background:radial-gradient(circle at 35% 30%,#2f7a46,#14401f)}
.info{font-size:14px;color:var(--mut);text-align:center}
h3{margin:4px 0;font-size:16px;align-self:flex-start}
.ups{width:100%}
.pop{position:absolute;font-weight:800;font-size:20px;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000;animation:up .9s ease-out forwards;z-index:50}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:56%;background:var(--ui);border-top:2px solid var(--yel);border-radius:16px 16px 0 0;display:none;flex-direction:column;z-index:20;box-shadow:0 -8px 24px #0009}
.sheet.on{display:flex}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px;flex:none}
.cats button{white-space:nowrap;font:inherit;font-weight:800;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--ui2);color:var(--txt);cursor:pointer}
.cats button.on{background:var(--blue);border-color:var(--yel)}
.list{overflow:auto;padding:0 8px 8px;flex:1}
.card{display:flex;align-items:center;gap:10px;background:var(--ui2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer}
.card:not(.no):hover{border-color:var(--blue2)}.card:not(.no):active{transform:scale(.98)}
.card.no{opacity:.55}
.card .e{font-size:30px;width:40px;text-align:center}
.card .t{flex:1;line-height:1.2}.card .t b{font-size:15px}.card .t small{display:block;color:var(--mut);font-size:12px}
.cost{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{background:var(--ui);border:1px solid var(--line);border-radius:8px;padding:0 6px;font-size:12px}
.chip.lack{border-color:var(--bad);color:var(--bad)}
.cnt{font-weight:800;color:var(--yel);font-size:16px}
.nav{display:flex;gap:6px;padding:6px 8px;background:var(--ui);border-top:2px solid var(--line)}
.nav button{flex:1;font:inherit;font-weight:800;font-size:13px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:var(--ui2);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px}
.nav button.on{background:var(--blue);border-color:var(--yel);box-shadow:0 3px 0 var(--yel)}
.toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ui);border:1px solid var(--blue2);color:#fff;padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90%;text-align:center;font-size:14px}
.toast.show{opacity:1}
.chip.ym{color:var(--yel);border-color:#854d0e}.chip.lack{border-color:var(--bad);color:var(--bad)}
h4{margin:10px 0 4px;font-size:14px;color:var(--yel)}
.pl{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--ui2);color:var(--txt);cursor:pointer}
.pchip.sel,.fcard.sel{border-color:var(--yel);background:#2a2208}
.acts{display:flex;gap:6px;margin:8px 0}
.acts button{flex:1;font:inherit;font-weight:800;font-size:13px;padding:9px 4px;border:0;border-radius:10px;background:var(--yel);color:#1a1405;cursor:pointer}
.fcard{background:var(--ui2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer;font-size:13px;line-height:1.4}
.fcard small{display:block;color:var(--mut)}
.fdel{font:inherit;font-size:11px;margin-top:4px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:2px 8px;cursor:pointer}
.ent.burn::after{content:'🔥';position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:28px;animation:fl .35s infinite alternate;pointer-events:none}
.ent.burn .em{filter:drop-shadow(0 0 8px #f97316) brightness(.8)}
@keyframes fl{to{transform:translateX(-50%) scale(1.25) rotate(8deg)}}
.bear{position:absolute;font-size:46px;line-height:1;transform:translate(-50%,-50%);transition:left 10s linear,top 10s linear;z-index:900;pointer-events:none;filter:drop-shadow(0 3px 3px #000a)}
.trash{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;background:var(--ui);border:2px dashed var(--bad);font-size:22px;display:flex;align-items:center;justify-content:center;z-index:30;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.trash.on{opacity:.95}.trash.hot{transform:scale(1.25);background:#450a0a;border-style:solid}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.box{background:var(--ui);border:2px solid var(--yel);border-radius:16px;padding:18px;max-width:340px;text-align:center;line-height:1.4}
.box p{color:var(--mut);font-size:14px;margin:8px 0 4px}
.box .acts button.gray{background:var(--ui2);color:var(--txt);border:1px solid var(--line)}
.box .acts button.danger{background:var(--bad);color:#1a0505}
.fchip{display:inline-flex;gap:3px;align-items:center;background:var(--ui2);border:1px solid var(--yel);border-radius:10px;padding:2px 8px;margin-left:4px;font-size:15px;cursor:grab;touch-action:none;color:var(--txt)}
.fchip.empty{opacity:.4;border-color:var(--line)}.fchip b{font-size:13px;color:var(--yel)}
.ghost{position:fixed;font-size:40px;pointer-events:none;z-index:300;transform:translate(-50%,-50%)}
.ent.busy .em{font-size:58px}
.wk{display:block;font-size:11px;font-weight:800;color:#1a1405;background:var(--yel);border-radius:8px;padding:0 6px;margin:2px auto 0;width:max-content}
.ent.walk{transition:left .2s linear,top .2s linear}
.ent.fight,.bear.fight{animation:shake .15s infinite alternate}
@keyframes shake{from{transform:translate(-50%,-50%) rotate(-7deg)}to{transform:translate(-50%,-50%) rotate(7deg)}}
.ent.danger .nm{color:#f87171;font-weight:800}
.ent.danger::before{content:'';position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-62%);border-radius:50%;background:#ef444455;border:2px solid #ef4444;z-index:-1;animation:pr .6s infinite alternate}
@keyframes pr{to{transform:translate(-50%,-62%) scale(1.3);background:#ef444488}}
.bub.red{background:#450a0a;border-color:var(--bad);color:#fff}
.bolt{position:absolute;inset:0;width:100%;height:100%;z-index:950;pointer-events:none;filter:drop-shadow(0 0 6px #fde047) drop-shadow(0 0 14px #facc15);animation:bf .8s forwards}
@keyframes bf{0%,20%,40%{opacity:1}10%,30%{opacity:.25}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#e0f2fe;z-index:940;pointer-events:none;animation:fl2 .6s forwards}
@keyframes fl2{0%{opacity:.5}100%{opacity:0}}
.zone{position:absolute;width:50%;height:50%;background:#050f0ae6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:2000;border:2px dashed var(--line);color:var(--mut);text-align:center;padding:8px}
.sq{position:absolute;width:50%;height:50%;border:1px dashed #ffffff1c;pointer-events:none}
.buyland{font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border:0;border-radius:10px;background:var(--yel);color:#1a1405;cursor:pointer}
.jb{position:absolute;right:-8px;top:-2px;font-size:13px;line-height:1.1;background:var(--ui);border:1px solid var(--yel);border-radius:8px;padding:0 2px;display:none}
.ent[data-k=hunter]::before{content:'';position:absolute;left:50%;top:50%;width:460px;height:460px;transform:translate(-50%,-50%);border:1px dashed #60a5fa40;border-radius:50%;z-index:-1;pointer-events:none}
.links{justify-content:flex-start;flex-wrap:wrap}
.links a,.links button{color:var(--yel);font:inherit;font-size:12px;font-weight:800;text-decoration:none;background:var(--ui2);border:1px solid var(--line);border-radius:10px;padding:3px 9px;cursor:pointer}
.lbbox{width:100%;max-width:380px;max-height:80vh;overflow:auto}
.lbl{text-align:left;font-size:14px;margin:8px 0}
.lbl div{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px solid var(--line)}
.lbl .me{color:var(--yel);font-weight:800}
@media (min-width:900px){#app{max-width:1100px}.sheet{height:46%}.big{width:240px;height:240px;font-size:108px}}
@media (max-width:480px){.big{width:170px;height:170px;font-size:78px}.res b{font-size:15px}.nav button{font-size:11px;padding:6px 1px}.nav button span{font-size:18px}.ent .em{font-size:32px}.ent.busy .em{font-size:48px}.stats{font-size:11px}.cats button{font-size:12px;padding:6px 8px}.zone{font-size:12px}}
@media (max-height:600px){.big{width:130px;height:130px;font-size:58px}}
.qd{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ui);border:2px solid var(--yel);border-radius:14px;padding:10px 16px;max-width:90%;width:max-content;text-align:center;z-index:98;opacity:0;pointer-events:none;transition:opacity .4s;display:flex;flex-direction:column;gap:4px;font-size:14px}
.qd b{color:var(--yel)}.qd.show{opacity:1}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
</style>
</head>

function cost(k){
 if(k.startsWith('upg:')){const n=k.slice(4),u=UPG[n],l=D.up[n];return l>=u.max?{money:Infinity}:{money:u.costs[l+1]}}

 if(k==='axe')return{money:Math.ceil(100*Math.pow(1.7,D.axe-1))};
 const d=IT[k],n=d.food?0:(C[k]||0),c={};for(const r in d.b)c[r]=Math.ceil(d.b[r]*Math.pow(d.g,n));return c}

 Object.keys(LAND).forEach(k=>{const[c,r]=k.split(',').map(Number),z=document.createElement('div');z.style.left=c*50+'%';z.style.top=r*50+'%';
  if(D.land[k])z.className='sq';else{z.className='zone';z.innerHTML=`<div style="font-size:34px">🔒</div><div>Территория: ${DIR[k]}</div><button class="buyland" data-land="${k}">Купить за ${fmt(LAND[k])} 💰</button>`}
  field.appendChild(z)})}
function upgradeAsk(ent){const u=UPG[ent.k];if(!u)return;const lv=ent.lv||LV0[ent.k];
 if(lv>=u.max)return toast(`${u.n}: максимальный уровень (${lv})`);
 const c=u.costs[lv+1];
 ask(`${u.n}: уровень ${lv} → ${lv+1}`,`${u.d(lv)} → ${u.d(lv+1)}. Цена ${fmt(c)} 💰. Улучшается только это здание.`,`Улучшить за ${fmt(c)} 💰`,()=>{
  if(!D.ents.includes(ent))return;if(D.money<c)return toast('Не хватает денег: нужно '+fmt(c)+' 💰');
  D.money-=c;ent.lv=lv+1;if(ent.k==='rod')ent.hp=Math.min(ent.lv,(ent.hp==null?lv:ent.hp)+1);toast(`⬆️ ${u.n} улучшен до уровня ${ent.lv}`)})}
function buyLand(k){const c=LAND[k];
 if(k==='1,0'&&!D.land['1,1']&&!D.land['0,0'])return toast('Сначала купи соседнюю территорию (вправо или вверх)');
 if(D.money<c)return toast('Не хватает денег: нужно '+fmt(c)+' 💰');
 ask('Купить территорию?','Новая территория: '+DIR[k]+'. Цена '+fmt(c)+' 💰.','Купить',()=>{if(D.money<c)return toast('Не хватает денег');D.money-=c;D.land[k]=1;renderZones();toast('🗺️ Территория куплена. Двигай поле: тяни за пустое место')})}
function spawnPos(){const cx=(vp.scrollLeft+vp.clientWidth/2)/Math.max(1,field.offsetWidth)*100,cy=(vp.scrollTop+vp.clientHeight/2)/Math.max(1,field.offsetHeight)*100;
 let k=(cx<50?0:1)+','+(cy<50?0:1);if(!D.land[k]){const a=Object.keys(D.land).filter(q=>D.land[q]);k=a[Math.random()*a.length|0]}
 const[c,r]=k.split(',').map(Number);return{x:c*50+6+Math.random()*38,y:r*50+4+Math.random()*20}}
function mkEnt(e){const d=IT[e.k],el=document.createElement('div');
 el.className='ent'+(d.s?' sm':'')+(d.ppl?' p':'');el.dataset.id=e.id;el.dataset.k=e.k;
 el.innerHTML=`<span class="em">${d.e}</span>${d.slots||d.svc||e.k==='house'||e.k==='rod'?'<span class="wk"></span>':''}`+(d.ppl?`<span class="bub"></span><span class="jb"></span><i class="nm">${e.name}</i>`:'');
 placeEl(el,e);field.appendChild(el);nodes[e.id]=el}
function spawn(k){const d=IT[k],e={id:D.nid++,k,...spawnPos()};
 if(d.ppl){e.name=NAMES[k][Math.random()*NAMES[k].length|0];e.hunger=100;e.fun=100;e.want=pickWant(k);if(k!=='pet')e.grace=180}

 D.ents.push(e);mkEnt(e)}

function buy(k){
 if(k.startsWith('upg:')){const n=k.slice(4),u=UPG[n];if(D.up[n]>=u.max)return toast('Максимальный уровень');
  const c=cost(k);if(!can(c))return toast('Не хватает денег');D.money-=c.money;D.up[n]++;
  if(n==='rod')D.ents.forEach(e=>{if(e.k==='rod')e.hp=Math.min(D.up.rod,(e.hp==null?D.up.rod-1:e.hp)+1)});
  toast(`⬆️ ${u.n}: уровень ${D.up[n]}`);renderShop();return}
 if(k==='pick'||k==='axe'){const c=cost(k);if(!can(c))return toast('Не хватает ресурсов');for(const r in c)D[r]-=c[r];D[k]++;renderUp();return}
 const d=IT[k],c=cost(k);
 if(k!=='town'&&!C.town)return toast('Сначала купи ратушу (Магазин → Промышленность)');
 if(d.req&&!C.hut)return toast('Сначала построй здание строителей');
 if(d.max&&(C[k]||0)>=d.max)return toast('Достигнут максимум');
 if(d.svc&&!C.house)return toast('ЖКХ доступно только после постройки жилого дома');
 if(k==='hunter'&&(C.hunter||0)>=2*(C.lodge||0))return toast('Нужна свободная охотничья хижина: в каждой живут 2 охотника');
 if(!can(c))return toast('Не хватает ресурсов');
 for(const r in c)D[r]-=c[r];
 if(d.food){D.food[d.food]+=d.qty;toast('+'+d.qty+' порций на складе — перетащи еду из «Склада» на жителя')}
 else{spawn(k);toast(d.n+' появился(ась) в деревне — перетащи на нужное место')}
 C=counts();renderShop();renderUp()}

function renderShop(){
 $('cats').innerHTML=CATS.map(([k,n])=>`<button data-c="${k}" class="${k===cat?'on':''}">${n}</button>`).join('');
 if(cat==='fam')return renderFam();

 $('list').innerHTML=Object.keys(IT).filter(k=>IT[k].c===cat).map(k=>{const d=IT[k],c=cost(k);
  const n=d.food?D.food[d.food]:(C[k]||0)+(d.max?'/'+d.max:'');
  return `<div class="card ${can(c)?'':'no'}" data-k="${k}"><div class="e">${d.e}</div><div class="t"><b>${d.n}</b><small>${DYN[k]?DYN[k]():d.d}${k!=='town'&&!C.town?' 🔒 нужна ратуша':d.req&&!C.hut?' 🔒 нужно здание строителей':k==='hunter'&&(C.hunter||0)>=2*(C.lodge||0)?' 🔒 нужна свободная охотничья хижина':d.svc&&!C.house?' 🔒 сначала построй жилой дом':''}</small>${chips(c)}</div><div class="cnt">${n}</div></div>`}).join('')}
function renderUpg(){$('list').innerHTML='<p class="info">Прокачка действует сразу на все такие здания. Платишь деньгами.</p>'+Object.keys(UPG).map(k=>{const u=UPG[k],l=D.up[k],mx=l>=u.max,c=cost('upg:'+k);
 return `<div class="card ${can(c)?'':'no'}" data-k="upg:${k}"><div class="e">${u.e}</div><div class="t"><b>${u.n}: ур. ${l}/${u.max}</b><small>${u.d(l)}${mx?' — максимум':' → '+u.d(l+1)}</small>${mx?'':chips(c)}</div></div>`}).join('')}
const upcard=(k,e,n,d)=>{const c=cost(k);return `<div class="card ${can(c)?'':'no'}" data-k="${k}"><div class="e">${e}</div><div class="t"><b>${n}</b><small>${d}</small>${chips(c)}</div></div>`};
function renderUp(){const m=mult();
 $('mi').innerHTML=`За клик: <b>${fmt1(D.pick*m)}</b> 🪨 · лимит кликов: 1000 в минуту`;
 $('ti').innerHTML=`За клик: <b>${fmt1(D.axe*m)}</b> 🪵 · лимит кликов: 1000 в минуту`;
 $('mineUp').innerHTML=upcard('pick','🔨','Кирка, ур. '+D.pick,'+1 🪨 за клик');
 $('treeUp').innerHTML=upcard('axe','🪓','Топор, ур. '+D.axe,'+1 🪵 за клик')}
function setView(v){if(view==='village'&&v!=='village')sc=[vp.scrollLeft,vp.scrollTop];view=v;['village','mine','forest'].forEach(s=>$(s).classList.toggle('on',s===v));

const LIM={mf:{kids:3,msg:'В семье мужчины и женщины не больше 3 детей'},mm:{kids:0,msg:'В семье двух мужчин нельзя заводить детей'},ff:{kids:2,msg:'В семье двух женщин не больше 2 детей'}};
const memb=f=>D.ents.filter(e=>e.fam===f.id);
const famType=f=>{const m=memb(f).filter(e=>e.k==='man').length;return m===1?'mf':m===2?'mm':'ff'};
const famName=f=>'Семья '+memb(f).filter(e=>e.k==='man'||e.k==='woman').map(e=>e.name).join(' и ');
const selEnts=()=>[...selP].map(id=>D.ents.find(e=>e.id===id)).filter(e=>e&&!e.fam);
function relabel(){D.ents.forEach(e=>{const n=nodes[e.id]&&nodes[e.id].querySelector('.nm');if(n){const ow=e.k==='pet'&&D.ents.find(o=>o.id===e.owner);n.textContent=e.name+(e.fam?' 💞':'')+(ow?' 🐾'+ow.name:'')}})}
function marry(){const a=selEnts();
 if(a.length!==2)return toast('Для свадьбы выбери ровно двух жителей без семьи');
 if(a.some(e=>['child','pet','hunter'].includes(e.k)))return toast('Жениться могут только взрослые мужчины и женщины');
 const f={id:D.nid++};D.fams.push(f);a.forEach(e=>e.fam=f.id);selP.clear();selF=f.id;relabel();renderFam();toast('💍 Новая семья создана!')}
function addFam(){const f=D.fams.find(f=>f.id===selF);
 if(!f)return toast('Сначала выбери семью — нажми на неё в списке');
 const a=selEnts();if(!a.length)return toast('Выбери, кого добавить в семью');
 const lim=LIM[famType(f)],m=memb(f);let kids=m.filter(e=>e.k==='child').length,pets=m.filter(e=>e.k==='pet').length;
 for(const e of a){
  if(e.k==='hunter')return toast('Охотники не вступают в семьи');
  if(e.k==='man'||e.k==='woman')return toast('В семье уже есть пара — взрослых добавлять нельзя');
  if(e.k==='child'){if(kids+1>lim.kids)return toast(lim.msg);kids++}
  else{if(pets+1>2)return toast('В семье не больше 2 питомцев');pets++}}
 a.forEach(e=>e.fam=f.id);selP.clear();relabel();renderFam();toast('Семья пополнилась ❤️')}
const isAd=e=>e.k==='man'||e.k==='woman';
function famAdd(e,f){const lim=LIM[famType(f)],m=memb(f);
 if(e.k==='child'){if(m.filter(o=>o.k==='child').length+1>lim.kids)return lim.msg}
 else if(m.filter(o=>o.k==='pet').length+1>2)return 'В семье не больше 2 питомцев';
 e.fam=f.id;return null}
function assignJob(e,j){const d=IT[j.k];
 if(!(e.k==='man'||e.k==='woman'))return toast(e.k==='child'?'Дети не работают':e.k==='hunter'?'Охотники не работают на предприятиях':'Питомцы не работают');
 if(e.job===j.id){e.job='none';return toast(e.name+' больше не работает: '+d.n)}
 if(D.ents.filter(p=>p!==e&&p.job===j.id).length>=slotsOf(j))return toast(d.n+': нет свободных мест ('+slotsOf(j)+')');
 e.job=j.id;toast('🔨 '+e.name+' теперь работает: '+d.n)}
function meet(a,b){
 if(a.k==='pet'){
  if(b.k==='pet')return toast('Питомца можно привязать только к жителю');
  if(b.fam&&a.fam!==b.fam){if(a.fam)return toast(a.name+' уже в другой семье');const f=D.fams.find(f=>f.id===b.fam),err=famAdd(a,f);if(err)return toast(err)}
  else if(!b.fam&&a.fam)return toast(a.name+' в семье — привяжи его к члену этой семьи');
  a.owner=b.id;relabel();renderFam();return toast(`🐾 ${a.name} теперь питомец: ${b.name}`)}
 if(a.k==='hunter'||b.k==='hunter')return toast('Охотники не вступают в семьи');
 if(isAd(a)&&isAd(b)){if(a.fam||b.fam)return toast('Кто-то из них уже в семье — жениться нельзя');
  const f={id:D.nid++};D.fams.push(f);a.fam=b.fam=f.id;relabel();renderFam();return toast(`💍 ${a.name} и ${b.name} поженились!`)}
 if(isAd(a))return toast(b.fam?'В этой семье уже есть пара — взрослых добавлять нельзя':'Жениться могут только взрослые мужчины и женщины');
 if(a.fam)return toast(a.name+' уже в семье');
 const f=D.fams.find(f=>f.id===b.fam);
 if(!f)return toast(isAd(b)?b.name+' без семьи — сначала поженить взрослых':'Дети и питомцы не женятся');
 const err=famAdd(a,f);if(err)return toast(err);
 relabel();renderFam();toast(a.name+' добавлен(а): '+famName(f))}
function dissolve(id){D.ents.forEach(e=>{if(e.fam===id)delete e.fam});D.fams=D.fams.filter(f=>f.id!==id);if(selF===id)selF=null;relabel();renderFam()}
function renderFam(){
 if(cat!=='fam')return;

document.addEventListener('visibilitychange',save);

// перетаскивание
field.addEventListener('pointerdown',e=>{const el=e.target.closest('.ent');if(!el){if(e.pointerType==='mouse'&&!e.target.closest('.buyland')){pan={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop};vp.style.cursor='grabbing';field.setPointerCapture(e.pointerId)}return}
 const en0=D.ents.find(o=>o.id==el.dataset.id);drag={el,ent:en0,ox:en0.x,oy:en0.y,cx:e.clientX,cy:e.clientY};el.setPointerCapture(e.pointerId);el.classList.add('drag');el.classList.remove('walk');$('trash').classList.add('on')});
field.addEventListener('pointermove',e=>{if(pan){vp.scrollLeft=pan.l-(e.clientX-pan.x);vp.scrollTop=pan.t-(e.clientY-pan.y);return}if(!drag)return;const r=field.getBoundingClientRect(),en=drag.ent;
 en.x=Math.min(97,Math.max(3,(e.clientX-r.left)/r.width*100));en.y=Math.min(95,Math.max(5,(e.clientY-r.top)/r.height*100));placeEl(drag.el,en);$('trash').classList.toggle('hot',overTrash(e))});
const endDrag=(e,drop)=>{if(!drag)return;const{el,ent,ox,oy,cx,cy}=drag;drag=null;el.classList.remove('drag');$('trash').classList.remove('on','hot');
 if(drop&&overTrash(e)){const d=IT[ent.k];
  ask('Удалить '+(d.ppl?ent.name:d.n)+'?','Деньги и ресурсы, потраченные на покупку, не вернутся.','Удалить',()=>{if(D.ents.includes(ent))deleteEnt(ent)},()=>{ent.x=ox;ent.y=oy;if(nodes[ent.id])placeEl(nodes[ent.id],ent)});return}

 if(drop&&UPG[ent.k]&&Math.hypot(e.clientX-cx,e.clientY-cy)<8&&!(ev.burn&&ev.burn.id===ent.id)){upgradeAsk(ent);return}
 if(drop&&!D.land[(ent.x<50?0:1)+','+(ent.y<50?0:1)]){ent.x=ox;ent.y=oy;placeEl(el,ent);toast('🔒 Эта территория не куплена');return}
 if(!drop||!IT[ent.k].ppl)return;
 const r=field.getBoundingClientRect();
 const o=D.ents.find(x=>x!==ent&&IT[x.k].ppl&&Math.hypot((x.x-ent.x)*r.width/100,(x.y-ent.y)*r.height/100)<44);
 if(o)return meet(ent,o);
 const pd=x=>Math.hypot((x.x-ent.x)*r.width/100,(x.y-ent.y)*r.height/100);
 const nr=D.ents.filter(x=>(x.k==='house'||IT[x.k].slots)&&pd(x)<56).sort((a,b)=>pd(a)-pd(b))[0];
 if(nr&&nr.k!=='house')return assignJob(ent,nr);
 const hz=nr;
 if(hz){if(ent.k==='pet')return toast('Питомцы не имеют дома — привяжи его к жителю');if(ent.k==='hunter')return toast('Охотникам дом не нужен — они живут в хижине');
  const cnt=D.ents.filter(p=>p!==ent&&IT[p.k].ppl&&p.k!=='pet'&&p.home===hz.id).length;
  if(cnt>=(hz.lv||4))return toast('В доме уже прописано '+(hz.lv||4)+' человек');
  ent.home=hz.id;return toast(`🏠 ${ent.name} прописан(а) в доме (${cnt+1}/${hz.lv||4})`)}
 if(ent.k==='pet'||ent.k==='hunter')return;
 const a=D.ents.find(o=>IT[o.k].fee&&Math.hypot((o.x-ent.x)*r.width/100,(o.y-ent.y)*r.height/100)<50);
 if(!a)return;
 if(ent.fun>70)return toast(ent.name+': пока не хочу кататься');
 ent.fun=100;const fee=Math.round(IT[a.k].fee*mult());D.money+=fee;pop(field,e.clientX,e.clientY,'+'+fee+' 💰 😄')};
field.addEventListener('pointerup',e=>{pan=null;vp.style.cursor='';endDrag(e,true)});
field.addEventListener('pointercancel',e=>{pan=null;vp.style.cursor='';endDrag(e,false)});

document.addEventListener('click',e=>{
 if(e.target.id==='yes'){const f=modalYes;modalYes=modalNo=null;$('modal').classList.remove('on');if(f)f();return}
 if(e.target.id==='no'||e.target.id==='modal'){const f=modalNo;modalYes=modalNo=null;$('modal').classList.remove('on');if(f)f();return}
 if(e.target.id==='autoBtn'){autoClick();return}
 const bl=e.target.closest('.buyland');if(bl){buyLand(bl.dataset.land);return}
 const bn=e.target.closest('.ent.burn');if(bn&&ev.burn){endBurn(true);return}
 const nb=e.target.closest('.nav button');
 if(nb){const v=nb.dataset.v;if(v==='shop'){if(view!=='village')view='village';shop=!shop;if(shop)renderShop();setView('village')}else{shop=false;setView(v)}return}
 const cb=e.target.closest('#cats button');if(cb){cat=cb.dataset.c;renderShop();return}
 const pc=e.target.closest('.pchip');if(pc){const id=+pc.dataset.p;selP.has(id)?selP.delete(id):selP.add(id);renderFam();return}
 const fx=e.target.closest('.fdel');if(fx){dissolve(+fx.dataset.d);return}
 const fc=e.target.closest('.fcard');if(fc){selF=+fc.dataset.f;renderFam();return}
 if(e.target.id==='marry'){marry();return}
 if(e.target.id==='addfam'){addFam();return}
 const cd2=e.target.closest('.card');if(cd2){buy(cd2.dataset.k);return}
 if(e.target.id==='mineBtn'){const g=clickCap('stone',D.pick*mult());if(g>0){D.stone+=g;pop($('mine'),e.clientX,e.clientY,'+'+fmt1(g)+' 🪨')}}
 if(e.target.id==='treeBtn'){const g=clickCap('wood',D.axe*mult());if(g>0){D.wood+=g;pop($('forest'),e.clientX,e.clientY,'+'+fmt1(g)+' 🪵')}}
 if(e.target.id==='reset')ask('Сбросить игру?','Деревня, ресурсы и жители будут удалены без возможности восстановления.','Да, сбросить',doReset);
});
$('tray').innerHTML=['bread','meat','milk','petfood'].map(k=>`<span class="fchip" data-f="${k}">${ICO[k]}<b id="fc-${k}">0</b></span>`).join('');
D.ents.forEach(e=>{if(LV0[e.k]&&e.lv==null){e.lv=(D.up&&D.up[e.k])||LV0[e.k];if(e.k==='rod'&&e.hp==null)e.hp=e.lv}});
C=counts();D.ents.forEach(mkEnt);relabel();setView('village');renderZones();autoBtn();requestAnimationFrame(()=>{vp.scrollLeft=0;vp.scrollTop=vp.scrollHeight});dailyQuote();
if(!D.ents.length)toast('Купи ратушу: 🛒 → Промышленность. Камень — в шахте, дерево — в лесу');
</script>
</body>
</html>
